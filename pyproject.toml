[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qaudit"
version = "0.1.0"
description = "A support-ticket RAG QA assistant whose real point is the evaluation harness: retrieval metrics, a validated LLM-as-judge, and a ship/no-ship ablation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Dense retrieval (sentence-transformers embeddings). Kept optional so the base
# install and CI stay light: the BM25 retriever and the heuristic judge need none
# of it, and the lexical path is the CI/no-download baseline.
dense = ["sentence-transformers>=2.7"]
# The local LLM judge. Optional and torch-heavy; the deterministic heuristic judge
# is the CI/no-GPU fallback and the evaluation floor.
llm = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30", "bitsandbytes>=0.43"]
# Offline dataset + tracing.
data = ["datasets>=2.18"]
trace = ["langsmith>=0.1"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qaudit = ["kb/*.json", "rubric/*.json", "eval/labels/*.json", "eval/labels/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
