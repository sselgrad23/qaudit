# Continuous integration. Runs free on GitHub-hosted runners for public repos.
# Gate: lint -> type-check -> tests (BM25 retriever + heuristic judge, no GPU, no
# model download), plus a Docker image build. The dense retriever and LLM judge are
# exercised offline via the eval scripts, not in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      QAUDIT_RETRIEVER: bm25
      QAUDIT_JUDGE_BACKEND: heuristic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src
      - name: Tests (pytest)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t qaudit-api .
